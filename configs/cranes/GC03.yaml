# Cấu hình cẩu GC03 cho ds_app.
#
# ⚠️ ĐANG DỞ. Mới có phần đã đo/kiểm chứng được. `common/config.py` là nguồn sự thật
# (schema JSON sinh từ pydantic model ở đó).
#
# Toạ độ vùng là TƯƠNG ĐỐI [0..1], không phải pixel — xem docs/DESIGN_NOTES.md DN-002.
#
# ─── Thêm camera ──────────────────────────────────────────────────────────────
# Camera nhóm theo CHỨC NĂNG. Thêm một camera cho chức năng đang có là hai bước:
#
#   1. Thêm một dòng vào nhóm tương ứng:  - {stream: rtsp://…, desc: …}
#   2. `make codes` — nó điền `code`, xếp lại thứ tự trường, và đối chiếu với mọi service
#      khoá theo mã đó.
#
# MỘT camera = MỘT dòng. Đếm camera bằng mắt, và một diff đổi camera nào thì thấy ngay
# camera đó — không phải lần qua ba dòng để biết dòng nào thuộc về ai.
#
# Không đặt tên, không cấp phát số, không đụng docker-compose lẫn file env.
#
# ⚠️ Mỗi camera chạy model là thêm tải NVDEC. Ngân sách ở docs/HARDWARE_BUDGET.md §2.2;
# vượt trần thì MỌI camera cùng tụt fps chứ không phải camera mới bị bỏ.
#
# ─── Credential ───────────────────────────────────────────────────────────────
# `stream` KHÔNG mang `user:pass` — file này nằm trong git. Credential dùng chung cho cả
# cẩu, lấy từ `CRANEOPS_RTSP_CRED` (đặt trong build/.env.ds). Đó là thứ DUY NHẤT không nằm
# ở đây, vì nó là bí mật chứ không phải cấu hình.
#
# Nhờ vậy `code` suy được từ chính file này: CI xác thực được config đã commit, và người
# review một diff biết ngay mã nào ứng với camera nào. Bản trước để cả URL ở env và hệ quả
# là mã camera KHÔNG tái tạo được nếu không có file env.
#
# ─── Ba cái tên, đừng nhầm ────────────────────────────────────────────────────
#   khoá   `tcode2`                    — người và CLI dùng (`--cam tcode2`)
#   code   `GC03_113_160_225_15_1512`  — trên Kafka, tên thư mục segment, và là khoá của
#                                        configs/rules/<cẩu>/<rule>/config.json
#   desc   "Đầu kéo - Lane 2"          — chỉ để đọc, KHÔNG dùng để khớp dữ liệu
#
# `code` SINH RA từ crane_id + host + cổng của `stream`. Sửa tay mà lệch thì load báo lỗi:
# nó hiện ra được nhưng không trôi được.

crane_id: GC03
berth_no: TS03 # mã bến, dùng để đối chiếu manifest Oracle
num_lane: 3

cameras:
  # --- nhận dạng mã container -------------------------------
  # Thêm camera để tăng độ chính xác thì thêm vào đây; nhánh model tự gộp nguồn mới
  # vào batch, không phải sửa code.
  ccode:
    # TODO ocr_rois: 8 vùng OCR tĩnh (xem docs/ARCHITECTURE.md)
    - {code: GC03_113_160_225_15_1508, stream: rtsp://113.160.225.15:1508//CH001.sdp, desc: Mặt phải trước}
    - {code: GC03_113_160_225_15_1511, stream: rtsp://113.160.225.15:1511//CH001.sdp, desc: Mặt trước - Lane 2}
    - {code: GC03_113_160_225_15_1513, stream: rtsp://113.160.225.15:1513//CH001.sdp, desc: Mặt trước - Lane 1}
    - {code: GC03_113_160_225_15_1514, stream: rtsp://113.160.225.15:1514//CH001.sdp, desc: Cửa sau - Lane 1}
    - {code: GC03_113_160_225_15_1515, stream: rtsp://113.160.225.15:1515//CH001.sdp, desc: Cửa sau - Lane 2}

  # --- nhận dạng số đầu kéo ---------------------------------
  # ⚠️ Vùng làn của tcode1 và crane1 có chiều NGƯỢC NHAU — hai camera nhìn cùng khu vực
  # từ hai hướng. Đây là lý do vùng khai theo từng camera thay vì suy từ một bộ đường
  # phân chia chung (xem internal/pkg/geometry.py).
  #
  # Đã kiểm chứng: 18849/18849 điểm lưới cho phán quyết lane đúng như mong đợi.
  tcode:
    - {code: GC03_113_160_225_15_1510, stream: rtsp://113.160.225.15:1510//CH001.sdp, desc: Đầu kéo - Lane 2}
    - {code: GC03_113_160_225_15_1512, stream: rtsp://113.160.225.15:1512//CH001.sdp, desc: Đầu kéo - Lane 1}

  # --- nhìn xuống khu vực dưới cẩu ----------------------------------
  crane:
    # KHÔNG có truck_lines: slot container xác định bằng khoảng cách container <-> đầu
    # xe, không bằng dải dọc mà đầu xe rơi vào. Xem docs/DESIGN_NOTES.md DN-001.
    - {code: GC03_113_160_225_15_1517, stream: rtsp://113.160.225.15:1517//CH001.sdp, desc: Trần container}

  # --- soi đáy, không chạy model -----------------------------------
  bottom:
    - {code: GC03_113_160_225_15_1516, stream: rtsp://113.160.225.15:1516//CH001.sdp, desc: Soi đáy}

  # --- chỉ ghi hình, không xử lý ----------------------------
  # Chỉ góp một mặt vào bộ ảnh 6 mặt — không chạy model, và KHÔNG decode.
  # Xem CameraRole.EVIDENCE_ONLY trong common/enum.py.
  evidence_only:
    - {code: GC03_113_160_225_15_1509, stream: rtsp://113.160.225.15:1509//CH001.sdp, desc: Hông trái - Trước}
# Nguồn thật đo 2026-08-29: cả 10 camera đều 2688x1520 @ 30 fps HEVC, GOP 50, IPPP.
# Lưu ý: `resolution`/`fps` ở tầng camera là ĐÍCH xử lý, không phải thuộc tính nguồn.
# Chi tiết + ngân sách NVDEC: docs/HARDWARE_BUDGET.md §2.
