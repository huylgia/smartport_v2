# Cấu hình cẩu GC03 cho ds_app.
#
# ⚠️ ĐANG DỞ. Mới có phần đã đo/kiểm chứng được. `common/config.py` là nguồn sự thật
# (schema JSON sinh từ pydantic model ở đó).
#
# Toạ độ vùng là TƯƠNG ĐỐI [0..1], không phải pixel — xem docs/DESIGN_NOTES.md DN-002.
#
# ─── Thêm camera ──────────────────────────────────────────────────────────────
# Camera nhóm theo CHỨC NĂNG. Thêm một camera cho chức năng đang có là hai bước:
#
#   1. Thêm một dòng vào nhóm tương ứng:  - {stream: rtsp://…, desc: …}
#   2. `make codes` — nó điền `code`, xếp lại thứ tự trường, và đối chiếu với mọi service
#      khoá theo mã đó.
#
# MỘT camera = MỘT dòng. Đếm camera bằng mắt, và một diff đổi camera nào thì thấy ngay
# camera đó — không phải lần qua ba dòng để biết dòng nào thuộc về ai.
#
# Không đặt tên, không cấp phát số, không đụng docker-compose lẫn file env.
#
# ⚠️ Mỗi camera chạy model là thêm tải NVDEC. Ngân sách ở docs/HARDWARE_BUDGET.md §2.2;
# vượt trần thì MỌI camera cùng tụt fps chứ không phải camera mới bị bỏ.
#
# ─── Credential ───────────────────────────────────────────────────────────────
# `stream` KHÔNG mang `user:pass` — file này nằm trong git. Credential dùng chung cho cả
# cẩu, lấy từ `CRANEOPS_RTSP_CRED` (đặt trong build/.env.ds). Đó là thứ DUY NHẤT không nằm
# ở đây, vì nó là bí mật chứ không phải cấu hình.
#
# Nhờ vậy `code` suy được từ chính file này: CI xác thực được config đã commit, và người
# review một diff biết ngay mã nào ứng với camera nào. Bản trước để cả URL ở env và hệ quả
# là mã camera KHÔNG tái tạo được nếu không có file env.
#
# ─── Ba cái tên, đừng nhầm ────────────────────────────────────────────────────
#   khoá   `tcode2`                    — người và CLI dùng (`--cam tcode2`)
#   code   `GC03_113_160_225_15_1512`  — trên Kafka, tên thư mục segment, và là khoá của
#                                        configs/rules/<cẩu>/<rule>/config.json
#   desc   "Đầu kéo - Lane 2"          — chỉ để đọc, KHÔNG dùng để khớp dữ liệu
#
# `code` SINH RA từ crane_id + host + cổng của `stream`. Sửa tay mà lệch thì load báo lỗi:
# nó hiện ra được nhưng không trôi được.

crane_id: GC03
berth_no: TS03 # mã bến, dùng để đối chiếu manifest Oracle
num_lane: 3
source_fps: 30 # MẶC ĐỊNH; camera nào khác nhịp thì khai riêng trong dòng của nó
# ⚠️ Ba camera KHÔNG chạy 30 fps — đo 2026-09-02 bằng `craneops-ds probe`, đếm khung trong
# chính đoạn ghi passthrough qua 8 đoạn: 1517=18, 1516=27, 1509=24. Phép đo 2026-08-29 ghi
# "cả 10 camera 30 fps" là sai. Khai sai làm `drop-frame-interval` tính sai, và nhịp model
# lệch mà không có gì báo — xem docs/HARDWARE_BUDGET.md §6.3.

cameras:
  # --- nhận dạng mã container -------------------------------
  # Thêm camera để tăng độ chính xác thì thêm vào đây; nhánh model tự gộp nguồn mới
  # vào batch, không phải sửa code.
  ccode:
    - {code: GC03_113_160_225_15_1508, stream: rtsp://113.160.225.15:1508//CH001.sdp, desc: Mặt phải trước, model_fps: 5}
    - {code: GC03_113_160_225_15_1511, stream: rtsp://113.160.225.15:1511//CH001.sdp, desc: Mặt trước - Lane 2, model_fps: 5}
    - {code: GC03_113_160_225_15_1513, stream: rtsp://113.160.225.15:1513//CH001.sdp, desc: Mặt trước - Lane 1, model_fps: 5}
    - {code: GC03_113_160_225_15_1514, stream: rtsp://113.160.225.15:1514//CH001.sdp, desc: Cửa sau - Lane 1, model_fps: 5}
    - {code: GC03_113_160_225_15_1515, stream: rtsp://113.160.225.15:1515//CH001.sdp, desc: Cửa sau - Lane 2, model_fps: 5}

  # --- nhận dạng số đầu kéo ---------------------------------
  # ⚠️ Vùng làn của tcode1 và crane1 có chiều NGƯỢC NHAU — hai camera nhìn cùng khu vực
  # từ hai hướng. Đây là lý do vùng khai theo từng camera thay vì suy từ một bộ đường
  # phân chia chung (xem internal/pkg/geometry.py).
  #
  # Đã kiểm chứng: 18849/18849 điểm lưới cho phán quyết lane đúng như mong đợi.
  tcode:
    - {code: GC03_113_160_225_15_1510, stream: rtsp://113.160.225.15:1510//CH001.sdp, desc: Đầu kéo - Lane 2, model_fps: 2}
    - {code: GC03_113_160_225_15_1512, stream: rtsp://113.160.225.15:1512//CH001.sdp, desc: Đầu kéo - Lane 1, model_fps: 2}

  # --- nhìn xuống khu vực dưới cẩu ----------------------------------
  crane:
    # KHÔNG có truck_lines: slot container xác định bằng khoảng cách container <-> đầu
    # xe, không bằng dải dọc mà đầu xe rơi vào. Xem docs/DESIGN_NOTES.md DN-001.
    - {code: GC03_113_160_225_15_1517, stream: rtsp://113.160.225.15:1517//CH001.sdp, desc: Trần container, model_fps: 3.3, source_fps: 18}

  # --- soi đáy, không chạy model -----------------------------------
  bottom:
    - {code: GC03_113_160_225_15_1516, stream: rtsp://113.160.225.15:1516//CH001.sdp, desc: Soi đáy, source_fps: 27}

  # --- chỉ ghi hình, không xử lý ----------------------------
  # Chỉ góp một mặt vào bộ ảnh 6 mặt — không chạy model, và KHÔNG decode.
  # Xem CameraRole.EVIDENCE_ONLY trong common/enum.py.
  evidence_only:
    - {code: GC03_113_160_225_15_1509, stream: rtsp://113.160.225.15:1509//CH001.sdp, desc: Hông trái - Trước, source_fps: 24}
# Nguồn thật: cả 10 camera đều 2688x1520 HEVC, GOP 50, IPPP. Nhịp thì KHÔNG đồng nhất —
# xem ghi chú `source_fps` ở đầu file và dòng của từng camera.
# Lưu ý: `resolution`/`fps` ở tầng camera là ĐÍCH xử lý, không phải thuộc tính nguồn.
# Chi tiết + ngân sách NVDEC: docs/HARDWARE_BUDGET.md §2.

# ─── Vùng OCR tĩnh ────────────────────────────────────────────────────────────
# Khoá theo MÃ CAMERA, không nhét vào dòng camera: giữ được "một camera một dòng" mà vẫn
# "một vùng một dòng". Cùng khuôn với configs/rules/<cẩu>/<rule>/config.json.
#
# MỘT vùng = MỘT cặp (lane, cont_dim). `shapes` khai hình dạng mã nào chạy trên vùng đó
# kèm tham số riêng của nó — v1 tách thành hai mục và chép toạ độ hai lần, nên hai bản
# trôi khỏi nhau được (và đã trôi ở ccode1 lane1/20feet). Ở đây vùng chỉ có một bản.
#
# ⚠️ Chỉ ccode1 phục vụ cả NGANG lẫn DỌC; mọi camera còn lại chỉ NGANG. Đây là quyết định
# nghiệp vụ: v1 có khai vùng dọc cho ccode2/ccode3, bỏ đi là GIẢM thứ v1 phát hiện được.
#
# Toạ độ TƯƠNG ĐỐI [0..1] nên không phụ thuộc độ phân giải. v1 dùng pixel tuyệt đối trong
# không gian nó tự co giãn về, nên chuyển sang phải chia theo độ phân giải v1 KHAI (720p
# cho ccode1, 4MP cho phần còn lại). Sinh bằng: python -m tools.convert_ocr_rois
#
# `input_size` KHÔNG khai: suy lúc chạy từ chính vùng đã cắt — giữ tỉ lệ, cạnh dài 640,
# làm tròn bội 32 (internal/pkg/vision/preprocess.py). v1 chỉnh tay 20 giá trị và đo lại
# cho thấy việc đó không mua được gì: công thức đọc đúng BẰNG bản chỉnh tay, tốn 91 % pixel.
# Chỉ khai đè khi ĐO ĐƯỢC một vùng cần khác — xem HARDWARE_BUDGET §6.2.
#
# ⚠️ Ngưỡng chấp nhận KHÔNG ở đây — cả 20 vùng dùng chung 0,95 nên nó là `ocr_threshold`
# của rule CCODE01, áp SAU khi đã đọc xong.
ocr_rois:
  # Mặt phải trước — horizontal, vertical
  GC03_113_160_225_15_1508:
    - {lane: '1', cont_dim: 40feet, roi: [0.3945, 0.1125, 0.8711, 0.9194], shapes: {horizontal: {expand_ratio: [1.1, 1.7]}, vertical: {expand_ratio: [1.0, 1.1]}}}
    - {lane: '1', cont_dim: 20feet, roi: [0.0000, 0.1917, 0.4375, 1.0000], shapes: {horizontal: {expand_ratio: [1.1, 1.7]}, vertical: {expand_ratio: [1.0, 1.1]}}}
    - {lane: '2', cont_dim: 40feet, roi: [0.4055, 0.4194, 0.6891, 0.8306], shapes: {horizontal: {expand_ratio: [1.1, 1.9]}, vertical: {expand_ratio: [1.0, 1.1]}}}
    - {lane: '2', cont_dim: 20feet, roi: [0.2188, 0.4681, 0.4719, 0.8306], shapes: {horizontal: {expand_ratio: [1.2, 1.9]}, vertical: {expand_ratio: [1.0, 1.1]}}}
  # Mặt trước - Lane 2 — horizontal
  GC03_113_160_225_15_1511:
    - {lane: '2', cont_dim: 40feet, roi: [0.3635, 0.6336, 0.6362, 1.0000], shapes: {horizontal: {expand_ratio: [1.1, 1.5]}}}
    - {lane: '2', cont_dim: 20feet, roi: [0.3743, 0.3961, 0.6362, 0.7875], shapes: {horizontal: {expand_ratio: [1.1, 1.7]}}}
  # Mặt trước - Lane 1 — horizontal
  GC03_113_160_225_15_1513:
    - {lane: '1', cont_dim: 40feet, roi: [0.3988, 0.5099, 0.6321, 0.8605], shapes: {horizontal: {expand_ratio: [1.1, 1.9]}}}
    - {lane: '1', cont_dim: 20feet, roi: [0.3486, 0.3401, 0.6090, 0.7263], shapes: {horizontal: {expand_ratio: [1.1, 1.9]}}}
  # Cửa sau - Lane 1 — horizontal
  GC03_113_160_225_15_1514:
    - {lane: '1', cont_dim: 40feet, roi: [0.2593, 0.6013, 0.6388, 0.9993], shapes: {horizontal: {expand_ratio: [1.07, 1.7]}}}
    - {lane: '1', cont_dim: 20feet, roi: [0.3196, 0.2908, 0.6116, 0.8651], shapes: {horizontal: {expand_ratio: [1.07, 1.7]}}}
  # Cửa sau - Lane 2 — horizontal
  GC03_113_160_225_15_1515:
    - {lane: '2', cont_dim: 40feet, roi: [0.2500, 0.4914, 0.5744, 1.0000], shapes: {horizontal: {expand_ratio: [1.07, 1.5]}}}
    - {lane: '2', cont_dim: 20feet, roi: [0.2816, 0.2349, 0.5677, 0.7105], shapes: {horizontal: {expand_ratio: [1.07, 1.5]}}}
