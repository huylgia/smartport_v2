# `ds_app` — DeepStream: RTSP → ghi hình passthrough + nhánh model.
#
#   docker compose --env-file build/.env.ds -f build/docker-compose.ds.yml run --rm record
#
# File env RIÊNG với Triton (`build/.env.triton`): hai service có ngân sách tài nguyên,
# tập secret và vòng đời khác hẳn nhau. Gộp chung thì đổi một biến của Triton lại phải
# khởi động lại ds_app, và ngược lại.

name: craneops-ds

x-ds: &ds
  image: ${DS_IMAGE:-craneops-ds:dev}
  build:
    context: ..
    dockerfile: build/ds_app.Dockerfile
  working_dir: /app
  environment: &ds-env
    # ⚠️ BẮT BUỘC. Plugin `nvstreammux` đọc biến này LÚC NẠP để chọn mux cũ hay mới. DS8
    # mặc định dùng mux MỚI, vốn bỏ qua toàn bộ thuộc tính của mux cũ mà code đang đặt —
    # và hậu quả là nó không bao giờ đẩy một batch nào, im lặng.
    USE_NEW_NVSTREAMMUX: "no"
    NVIDIA_DRIVER_CAPABILITIES: all
    PYTHONUNBUFFERED: "1"
    GST_DEBUG: ${GST_DEBUG:-1}
  # URL camera nạp NGUYÊN FILE, không liệt kê từng biến.
  #
  # Bản trước khai tay `CAM01_RTSP … CAM10_RTSP`, tức chặn cứng ở 10 camera: thêm camera
  # thứ 11 mà quên sửa file này thì URL tới nơi RỖNG, và lỗi hiện ra ở tận tầng GStreamer.
  # `env_file` không có trần, và thêm camera không còn phải đụng tới compose.
  env_file:
    - .env.ds
  # Dùng CHUNG network với Triton, không tạo network riêng. Hai lý do:
  #   * ds_app sẽ gọi Triton qua gRPC ở Phase 3b — cùng network là chỗ nó cần ở.
  #   * Dải địa chỉ của Docker là tài nguyên hữu hạn trên máy dùng chung. Mỗi `compose run`
  #     tạo thêm một network; hết dải là `all predefined address pools have been fully
  #     subnetted` và KHÔNG service nào lên được, kể cả của người khác.
  networks: [craneops]
  volumes:
    # Mã nguồn mount chỉ-đọc: sửa code là chạy lại thấy ngay, không phải build lại image.
    - ..:/app:ro
    # ⚠️ Đường dẫn tương đối ở đây tính từ thư mục CHỨA COMPOSE (build/), không phải gốc
    # repo — mặc định cũ `./rec` làm video rơi vào build/rec/ và suýt bị commit.
    - ${CRANEOPS_REC_DIR:-../.rec}:/rec
  deploy: &ds-limits
    resources:
      limits:
        cpus: "${DS_CPUS:-6}"
        memory: ${DS_MEMORY:-6g}
        pids: 512
      reservations:
        devices:
          # ⚠️ `count: all`, KHÔNG phải `device_ids`. Pin GPU cấp CUDA compute nhưng không
          # cấp node V4L2 của NVDEC (/dev/nvidia-caps/…), và khi đó `nvv4l2decoder` treo ở
          # PREROLLING **không một thông báo lỗi nào**. Xem docs/DESIGN_NOTES.md DN-014.
          #
          # Giới hạn GPU nào được dùng bằng NVIDIA_VISIBLE_DEVICES nếu cần chia máy.
          - driver: nvidia
            count: all
            capabilities: [gpu, video]

services:
  # --- chỉ ghi hình, không suy luận ------------------------------------------
  # Dùng để kiểm nguồn, xem metadata khung, và là chế độ chạy THẬT của vai trò
  # `bottom` / `evidence_only` vốn không bao giờ chạy model.
  record:
    <<: *ds
    command: >
      python3 ds_app/cmd/record.py
        --cam ${CAM:-1}
        --duration ${DUR:-60}
        --out /rec
        --segment-sec ${SEGMENT_SEC:-30}
        --keep-segments ${KEEP_SEGMENTS:-6}
        ${META:+--show-meta}
    restart: "no"

  # --- nhánh model: camera -> Triton -----------------------------------------
  # Cần Triton chạy trước (`craneops-triton up`). Nó nằm trên network `craneops` nên
  # địa chỉ là tên service, không phải localhost.
  detect:
    <<: *ds
    command: >
      python3 ds_app/cmd/detect.py
        --role ${ROLE:-all}
        --duration ${DUR:-60}
        --triton ${TRITON:-triton:8001}
        --bus ${BUS:-redpanda:9092}
        ${QUIET:+--quiet}
        --restart-after ${RESTART_AFTER:-0}
        --blackout-after ${BLACKOUT_AFTER:-0}
        --blackout ${BLACKOUT:-30}
    restart: "no"

  # --- kiểm môi trường -------------------------------------------------------
  # Chạy trước khi nghi ngờ bất cứ điều gì khác: nó phân biệt "image hỏng" với
  # "cấu hình hỏng".
  doctor:
    <<: *ds
    command: python3 ds_app/cmd/doctor.py
    restart: "no"

networks:
  # `external`: network do bộ lệnh craneops tạo và sở hữu, không thuộc project nào.
  # Cùng khai `name:` ở hai project thì compose cảnh báo ở mọi lệnh, và `down` của project
  # này sẽ thử xoá network project kia đang dùng. Tạo bằng: docker network create craneops
  # (craneops-lib.sh làm việc đó tự động).
  craneops:
    external: true
