name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync dependencies
        # Không cài onnxruntime-gpu / tritonclient trên CI: không có GPU.
        run: uv sync --extra dev --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy .

      - name: Unit tests
        run: uv run pytest tests/unit --cov --cov-report=term-missing

      - name: Docs generated from code are up to date
        # Schema JSON và ví dụ payload đều được SINH RA từ pydantic model. Nếu ai sửa
        # model mà quên regenerate, CI phải fail. Không có bước này thì tài liệu trôi
        # khỏi code trong im lặng — không ai chạy ví dụ JSON trong file .md.
        run: |
          uv run python -m tools.gen_message_examples --check
