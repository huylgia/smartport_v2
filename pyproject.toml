[project]
name = "smartport-v2"
version = "2.0.0.dev0"
description = "DaNang Smart Port CraneOps AI — v2 (DeepStream + Triton + Kafka)"
requires-python = ">=3.10,<3.13"
license = { text = "Proprietary" }

# Chỉ những gì các service Python cần. ds_app KHÔNG dùng nhóm này — nó chạy
# trong container DeepStream với môi trường riêng (xem ds_app/requirements.txt).
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "aiokafka>=0.10,<0.13",
    "loguru>=0.7,<0.8",
    "numpy>=1.26,<2",
    "opencv-python-headless>=4.9,<5",
    "shapely>=2.0,<3",
    "pyclipper>=1.3,<2",
    "pyyaml>=6,<7",
    "httpx>=0.27,<1",
    "minio>=7.2,<8",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "cryptography>=43,<44",
    "psutil>=5.9,<7",
]

[project.optional-dependencies]
# Backend inference tham chiếu — dùng cho golden test và máy dev không có Triton.
ort = ["onnxruntime-gpu>=1.17,<2"]
# Client Triton (đường chạy chính ở production).
triton = ["tritonclient[grpc]>=2.44,<3"]
# Oracle CATOS.
oracle = ["oracledb>=2.2,<3"]
# tools/export_models.py: .t7 -> ONNX -> config.pbtxt -> TensorRT plan.
export = ["onnx>=1.16,<2"]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "types-pyyaml",
    "pre-commit>=3.7",
    # 6.1.1 là bản đã kiểm trên máy đích (Python 3.10); nó không có wheel cho 3.12 nên
    # dev dùng dải để cài được ở cả hai nơi.
    # Build production pin cứng trong build/requirements-build.txt để tái lập được.
    "pyinstaller>=6.1,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common", "gateway", "internal", "services"]

# ----------------------------------------------------------------------------
# ruff
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["ds_app/nvdsinfer_custom", "triton/repo"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear  -> B006 chặn mutable default args
    "UP",       # pyupgrade
    "C4",       # comprehensions
    "SIM",      # simplify
    "PTH",      # dùng pathlib thay os.path
    "RUF",
    "T20",      # flake8-print    -> chặn print(); log phải đi qua loguru để có tag + rotate
    "S",        # bandit
    "ASYNC",
]
ignore = [
    "E501",     # độ dài dòng đã do formatter lo
    "S101",     # assert -> cho phép trong tests/ (xem per-file-ignores)
]

[tool.ruff.lint.per-file-ignores]
# S105/S106: mật khẩu "hardcode" trong test là dữ liệu test, không phải secret.
"tests/**"  = ["S101", "S105", "S106", "T20"]
"tools/**"  = ["T20"]          # script CLI được phép in ra stdout
"services/**" = ["T20"]        # entrypoint in banner trước khi logger sẵn sàng
"triton/modelsvc/**" = ["T20"] # chạy như ExecStartPre, ghi thẳng ra journal

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

# ----------------------------------------------------------------------------
# mypy
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
show_error_codes = true
# triton/repo/**/1/model.py: Triton bắt buộc mọi model đặt tên file là `model.py`, nên
# mypy thấy nhiều module trùng tên. Chúng chỉ là 5 dòng đặt bí danh; phần có thể sai
# nằm ở triton/bls/ và internal/pkg/, hai chỗ đó vẫn được kiểm.
exclude = [
    "^ds_app/nvdsinfer_custom/",
    "^build/",
    "^tests/golden/data/",
    "^triton/repo/",
]

[[tool.mypy.overrides]]
# Thư viện native / không có stub, HOẶC nằm trong extra tuỳ chọn nên có thể không được cài.
# `onnx` thuộc loại thứ hai: nó chỉ nằm trong extra `export`, nên thiếu nó ở đây làm
# `make check` đỗ hay trượt tuỳ vào việc máy đó có tình cờ cài extra hay không.
module = [
    "cv2.*",
    "pyclipper.*",
    "shapely.*",
    "minio.*",
    "oracledb.*",
    "tritonclient.*",
    "onnx.*",
    "onnxruntime.*",
    "pyds.*",
    "gi.*",
    "pynvml.*",
    "triton_python_backend_utils.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Thư mục gốc phải nằm trong sys.path để `import common`, `import internal` chạy được
# lúc chạy. Không có gì để kiểm kiểu ở đây.
module = ["src.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ds_app chạy trong container DeepStream, phụ thuộc pyds/GStreamer không có ở đây.
module = ["ds_app.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# Script này chạy trong môi trường tạm có TensorFlow + kecam + tf2onnx (xem docstring của
# nó). Cố ý KHÔNG đưa TF vào dependency chính — quá nặng và chỉ dùng một lần.
module = ["tools.export_headcode_cls"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["tensorflow.*", "tf2onnx.*", "keras_cv_attention_models.*", "h5py.*"]
ignore_missing_imports = true

# ----------------------------------------------------------------------------
# pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config"
markers = [
    "golden: so với baseline đã chốt (cần tests/golden/data)",
    "integration: cần Kafka/Triton đang chạy",
    "gpu: cần GPU",
]

[tool.coverage.run]
branch = true
source = ["common", "gateway", "internal"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
